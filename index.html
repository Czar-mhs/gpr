<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MHS+ GPR">
<meta name="theme-color" content="#1B2A3A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>MHS+ GPR Reports</title>
<style>
:root{
  --navy:#1B2A3A; --navy2:#253a50; --amber:#C8902E; --bg:#E8EBED; --paper:#fff; --ink:#1E2328; --mute:#5F6973; --line:#D2D8DD;
  --ok:#2E7D4F; --warn:#BF8014; --bad:#B3261E;
  --font:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:290px 1fr;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
header{grid-column:1/-1;background:var(--navy);color:#fff;display:flex;align-items:center;gap:16px;
  padding:calc(env(safe-area-inset-top) + 10px) 20px 10px;border-bottom:3px solid var(--amber)}
header .brand{font-weight:600;letter-spacing:.2px}
header .rn{font-variant-numeric:tabular-nums;font-size:22px;font-weight:600}
header .rn small{font-size:14px;font-weight:500;opacity:.7;margin-left:8px}
header .sp{flex:1}
header .save{font-size:13px;opacity:.7}
.btn{border:0;border-radius:8px;padding:11px 16px;min-height:44px;font-weight:600;cursor:pointer;background:#fff;color:var(--navy);border:1px solid var(--line)}
.btn.primary{background:var(--amber);color:#1b1407;border-color:var(--amber)}
.btn.dark{background:var(--navy2);color:#fff;border-color:#35506b}
.btn.ghost{background:transparent;border-color:transparent;color:var(--navy);padding-left:8px;padding-right:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.nav:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
aside{background:var(--paper);border-right:1px solid var(--line);overflow:auto;padding:14px 12px calc(env(safe-area-inset-bottom) + 14px)}
.nav{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:11px 12px;min-height:44px;cursor:pointer;color:var(--ink)}
.nav.on{background:#EEF1F4;font-weight:600;box-shadow:inset 3px 0 0 var(--amber)}
.group{font-size:13px;color:var(--mute);margin:18px 12px 6px;font-weight:600}
.loc{display:grid;grid-template-columns:6px 1fr;gap:10px;align-items:stretch}
.loc .bar{border-radius:3px;background:#B9C0C6}
.loc .bar.clear{background:var(--ok)} .loc .bar.restricted{background:var(--warn)} .loc .bar.notfeasible{background:var(--bad)}
.loc .t{font-weight:600} .loc .m{font-size:13px;font-weight:500;color:var(--mute);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{overflow:auto;padding:24px 28px calc(env(safe-area-inset-bottom) + 40px)}
.sheet{max-width:920px}
h1{font-size:26px;margin:0 0 4px;font-weight:600;color:var(--navy)}
.lead{color:var(--mute);margin:0 0 22px;max-width:62ch;line-height:1.45}
h2{font-size:17px;margin:28px 0 12px;color:var(--navy);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 18px}
.full{grid-column:1/-1}
label{display:block;font-size:14px;font-weight:600;color:#39434d;margin-bottom:6px}
.hint{font-weight:500;color:var(--mute);font-size:13px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:11px 12px;min-height:44px}
textarea{min-height:110px;line-height:1.45;resize:vertical}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.readout{font-variant-numeric:tabular-nums;font-size:14px;color:var(--navy);background:#EEF1F4;border-radius:6px;padding:4px 8px;margin-top:6px;display:inline-block}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{min-height:52px;border-radius:8px;border:2px solid var(--line);background:#fff;font-weight:600;cursor:pointer;padding:6px}
.seg button.on.clear{border-color:var(--ok);background:#E6F2EA;color:var(--ok)}
.seg button.on.restricted{border-color:var(--warn);background:#FBF1DD;color:#8a5c0c}
.seg button.on.notfeasible{border-color:var(--bad);background:#F8E3E1;color:var(--bad)}
.img{border:1px dashed #AEB7BF;border-radius:10px;background:#F7F8F9;min-height:150px;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.img img{max-width:100%;max-height:260px;display:block}
.img .ph{color:var(--mute);font-size:14px;text-align:center;padding:16px}
.img input{position:absolute;inset:0;opacity:0;cursor:pointer}
.img .x{position:absolute;top:8px;right:8px;z-index:2;background:#fff;border:1px solid var(--line);border-radius:6px;min-height:36px;padding:4px 10px;cursor:pointer}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ai{display:flex;gap:10px;align-items:center;margin:8px 0}
.note{font-size:13px;color:var(--mute);line-height:1.4}
.checks{background:#fff;border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:12px 16px;margin:14px 0}
.checks ul{margin:6px 0 0;padding-left:20px} .checks li{margin:3px 0}
.ok{border-left-color:var(--ok)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:9;max-width:90vw}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
@keyframes s{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}aside{max-height:34vh;border-right:0;border-bottom:1px solid var(--line)}.grid{grid-template-columns:1fr}header .brand,header .save{display:none}}

.badge{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:#EEF1F4;color:var(--navy);vertical-align:middle;white-space:nowrap}
.badge.draft{background:#FBF1DD;color:#8a5c0c}.badge.issued{background:#E6F2EA;color:var(--ok)}.badge.superseded{background:#ECEEF0;color:#6b747c}
header .badge{margin-left:10px;font-size:12px}
.banner{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:8px;padding:12px 16px;margin:0 0 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;line-height:1.4}
.banner.warn{border-left-color:var(--warn)}
.banner .grow{flex:1;min-width:220px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff;margin-top:12px;-webkit-overflow-scrolling:touch}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th{background:#EEF1F4;text-align:left;font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:13px;color:#39434d}
table.t td{border-bottom:1px solid #EEF1F4;padding:4px 6px;vertical-align:middle}
table.t tr.cur td{background:#FBF6EC}
table.t input,table.t select{min-height:40px;padding:6px 8px;border-radius:6px;min-width:76px}
table.t td.w input{min-width:190px} table.t td.n{white-space:nowrap}
table.t td .btn{min-height:40px;padding:6px 12px}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;background:#D3D8DC}.dot.y{background:var(--ok)}
.chk{display:flex!important;gap:10px;align-items:center;font-weight:600;margin:10px 0 0;cursor:pointer}
.chk input{width:22px;height:22px;min-height:0;flex:none;accent-color:var(--ok)}
.seg.two{grid-template-columns:1fr 1fr}.seg.four{grid-template-columns:repeat(3,auto);justify-content:start}
.seg button.on.pick{border-color:var(--navy);background:#EEF1F4;color:var(--navy)}
.seg.four button{min-height:44px;padding:6px 16px}
.checks.bad{border-left-color:var(--bad)} .checks .warnhead{margin-top:12px}
.checks li .btn{min-height:36px;padding:4px 12px;margin-left:8px;font-size:14px}
.readybar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 20px);background:var(--navy);color:#fff;border-radius:12px;padding:12px 14px 12px 18px;display:flex;gap:10px;align-items:center;z-index:10;box-shadow:0 8px 28px rgba(0,0,0,.28);max-width:94vw;flex-wrap:wrap}
.readybar .btn.ghost{color:#fff}
.pager{display:flex;gap:10px;justify-content:space-between;margin:0 0 16px}
.search{max-width:420px;margin-top:14px}
.small{font-size:13px;color:var(--mute)}
input:disabled,textarea:disabled,select:disabled{background:#F4F6F7;color:#39434d;-webkit-text-fill-color:#39434d;opacity:1}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="brand">MHS+ GPR Reports</div>
      <div class="rn" id="hdrNo"></div>
    </div>
    <div class="sp"></div>
    <span class="save" id="saveState"></span>
    <button class="btn dark" id="btnPdf">Create PDF</button>
  </header>
  <aside id="nav"></aside>
  <main><div class="sheet" id="view"></div></main>
</div>
<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
<script src="report.js"></script>
<script>
/* ================= Defaults ================= */
const APP_VERSION='4.0';
const DEFAULT_COMPANY = {
  name:'MHS+ Project Management Services LLC', address:'#204 Falcon House, Dubai Investment Park, Dubai, UAE', website:'mhs-gpr.com', logo:'',
  preparedBy:'Eng. Mohammed Saud', reviewedBy:'Eng. Mahmoud', approvedBy:'Eng. Mohammed Hussain Shaz',
  methodology:'The investigation was carried out using a Proceq GP8000 stepped-frequency continuous-wave ground penetrating radar. The instrument transmits broadband electromagnetic energy into the concrete and records reflections from interfaces with differing electrical properties, such as steel reinforcement, conduits, voids and the slab underside. Depth is calculated from two-way travel time using a wave velocity calibrated on site. Line scans and area (C-scan) grids were taken at each location, and detected reinforcement and services were marked on the concrete surface.',
  limitations:'GPR detects contrasts in electrical properties and does not identify materials directly. Results depend on concrete condition, moisture content and reinforcement density; targets beneath dense steel may be masked, and objects closer together than the resolution limit may not be distinguished. Bar diameter, and whether a service is live or dead, cannot be determined by GPR. Depths are based on the calibrated wave velocity stated for each location and should be regarded as estimates. The absence of a detected target does not guarantee the absence of an object. Findings apply only to the areas scanned on the date of the investigation.'
};
const DEFAULT_INSTR = { model:'Proceq GP8000', serial:'', certSerial:'', antenna:'Stepped-frequency, 0.2 to 4.0 GHz', calBy:'Betalink Instrumentation & Calibration Services', certNo:'', calDate:'', calDue:'', certImage:'' };
const DEFAULT_DEVICE = { name:'iPad 1', prefix:'MHS', from:200, to:399, year:0, next:0 };
const DEFAULT_DEFAULTS = { idPrefix:'S-', description:'', scanType:'', er:'', erMethod:'', orientation:'', spacing:'', thickness:'' };
const LOC_BLANK = { id:'', description:'', scanType:'', er:'', erMethod:'', orientation:'', spacing:'', cover:'', bottom:'', targets:'', thickness:'', anomalies:'',
  conclusion:'', status:'', result:'', photo:'', scan:'', erChecked:false, dupOf:'', sameOk:false };
const FINDINGS = ['description','scanType','er','erMethod','orientation','spacing','cover','bottom','targets','thickness','anomalies','conclusion'];
const STATUS_LABEL = {clear:'Clear to proceed',restricted:'With restrictions',notfeasible:'Not feasible'};
const REG_LABEL = {draft:'Draft',issued:'Issued',superseded:'Superseded'};

const uid = () => Math.random().toString(36).slice(2,10);
const today = () => new Date().toISOString().slice(0,10);
const T = x => String(x??'').trim();

let settings = JSON.parse(localStorage.getItem('gpr.settings')||'null') || {};
settings.shortcut = settings.shortcut || 'MHS GPR Draft';
settings.company = {...DEFAULT_COMPANY, ...(settings.company||{})};
settings.instrument = {...DEFAULT_INSTR, ...(settings.instrument||{})};
settings.device = {...DEFAULT_DEVICE, ...(settings.device||{})};
const saveSettings = () => { try{ localStorage.setItem('gpr.settings', JSON.stringify(settings)); }catch{ toast('Settings not saved: the logo or certificate image is too large.'); } };

let S=null, REG=[], view='job', lastPrompt='', REGQ='', TABLEF='all';
let BULK={scans:[],photos:[],sort:false,prefix:'',start:null};

/* ================= IndexedDB ================= */
const idb = new Promise((res,rej)=>{ const r=indexedDB.open('gpr',1); r.onupgradeneeded=()=>r.result.createObjectStore('kv'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const tx = async (mode,fn) => { const d=await idb; return new Promise((r,j)=>{ const t=d.transaction('kv',mode); const q=fn(t.objectStore('kv')); t.oncomplete=()=>r(q&&q.result); t.onerror=()=>j(t.error); }); };
const dbGet = k => tx('readonly',s=>s.get(k)).catch(()=>null);
const dbSet = (k,v) => tx('readwrite',s=>{ s.put(v,k); });
const dbDel = k => tx('readwrite',s=>{ s.delete(k); });
const dbKeys = () => tx('readonly',s=>s.getAllKeys());

/* ================= Images (stored once, referenced by id) ================= */
const IMG = new Map();
const isRef = v => typeof v==='string' && v.startsWith('img:');
const src = v => isRef(v) ? (IMG.get(v)||'') : (v||'');
async function putImage(dataUrl){ const id='img:'+uid()+uid(); await dbSet(id,dataUrl); IMG.set(id,dataUrl); return id; }
function refsOf(o,acc=new Set()){ if(typeof o==='string'){ if(isRef(o)) acc.add(o); } else if(o&&typeof o==='object') for(const k in o) refsOf(o[k],acc); return acc; }
async function loadImages(j){ for(const r of refsOf(j)) if(!IMG.has(r)) IMG.set(r, (await dbGet(r))||''); }
function mapStrings(o,fn){ if(typeof o==='string') return fn(o); if(Array.isArray(o)) return o.map(x=>mapStrings(x,fn)); if(o&&typeof o==='object'){ const r={}; for(const k in o) r[k]=mapStrings(o[k],fn); return r; } return o; }
const inlineImages = j => mapStrings(j, v=>isRef(v)?src(v):v);
async function externalise(o){
  if(typeof o==='string') return o.startsWith('data:image')&&o.length>4000 ? await putImage(o) : o;
  if(Array.isArray(o)){ const r=[]; for(const x of o) r.push(await externalise(x)); return r; }
  if(o&&typeof o==='object'){ const r={}; for(const k in o) r[k]=await externalise(o[k]); return r; }
  return o;
}
async function gc(){
  try{ const keep=new Set(); for(const r of REG){ const j=(S&&r.id===S.id)?S:await dbGet('job:'+r.id); if(j) refsOf(j,keep); }
    for(const k of await dbKeys()) if(isRef(k)&&!keep.has(k)){ await dbDel(k); IMG.delete(k); } }catch(e){ console.warn(e); }
}
function resizeImage(file,max=1600,q=0.82){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>shrink(fr.result,max,q).then(res,rej); fr.onerror=rej; fr.readAsDataURL(file); }); }
function shrink(dataUrl,max,q){ return new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>{ const r=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*r); c.height=Math.round(im.height*r); const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); }; im.onerror=rej; im.src=dataUrl; }); }

/* ================= Report numbering (per-iPad block) ================= */
const yearNow = () => new Date().getFullYear();
const fmtNo = n => `${T(settings.device.prefix)||'MHS'}-${String(n).padStart(3,'0')}-${yearNow()}`;
function peekNumber(){ const d=settings.device, y=yearNow(); if(+d.year!==y || !(+d.next)){ d.year=y; d.next=parseInt(d.from)||1; saveSettings(); } return parseInt(d.next); }
function takeNumber(){
  let n=peekNumber(); const used=new Set(REG.map(r=>r.reportNo));
  while(used.has(fmtNo(n))) n++;
  settings.device.next=n+1; saveSettings();
  const left=(parseInt(settings.device.to)||0)-n;
  if(left<0) setTimeout(()=>toast(`This iPad has used its whole number block. Set a new block in Company and iPad settings.`,6000),600);
  else if(left<10) setTimeout(()=>toast(`Only ${left} report numbers left in this iPad's block.`,5000),600);
  return fmtNo(n);
}

/* ================= Jobs and register ================= */
function nextLocId(j=S){ const p=j.defaults?.idPrefix??''; let max=0; j.locations.forEach(L=>{ const m=String(L.id).match(/(\d+)\s*$/); if(m) max=Math.max(max,+m[1]); }); return p+(max+1); }
function newLoc(j=S){ const d=j.defaults||{}; return {...LOC_BLANK, uid:uid(), id:nextLocId(j), description:d.description||'', scanType:d.scanType||'', er:d.er||'', erMethod:d.erMethod||'',
  orientation:d.orientation||'', spacing:d.spacing||'', thickness:d.thickness||''}; }
function blankJob(){ const c=settings.company; const {certImage,...ins}=settings.instrument;
  return { id:uid(), meta:{status:'draft',issuedAt:'',device:settings.device.name,created:new Date().toISOString(),supersedes:''}, layout:'standard', defaults:{...DEFAULT_DEFAULTS},
    job:{ reportNo:'', rev:'0', date:today(), project:'', location:'', client:'', clientRef:'', scanDate:today(), scope:'', siteMap:'', photos:[],
      preparedBy:c.preparedBy, reviewedBy:c.reviewedBy, approvedBy:c.approvedBy, revNotes:'' },
    instrument:{...DEFAULT_INSTR,...ins,certImage:certImage||''}, locations:[], summary:'' }; }
function normalise(j){
  j.id=j.id||uid(); j.meta={status:'draft',issuedAt:'',device:'',created:'',supersedes:'',...(j.meta||{})};
  j.layout=j.layout||'standard'; j.defaults={...DEFAULT_DEFAULTS,...(j.defaults||{})}; j.instrument={...DEFAULT_INSTR,...(j.instrument||{})};
  j.job.photos=j.job.photos||[]; j.summary=j.summary||'';
  j.locations=(j.locations||[]).map(L=>({...LOC_BLANK,...L,uid:L.uid||uid()}));
  if(!j.locations.length) j.locations.push(newLoc(j));
  return j;
}
const regEntry = j => ({ id:j.id, reportNo:T(j.job.reportNo), rev:T(j.job.rev), project:T(j.job.project), client:T(j.job.client), location:T(j.job.location),
  scanDate:j.job.scanDate||'', status:j.meta.status, issuedAt:j.meta.issuedAt||'', device:j.meta.device||'', n:j.locations.length, updated:j.updated||Date.now() });
function upsertReg(j){ const e=regEntry(j), i=REG.findIndex(r=>r.id===j.id); if(i<0) REG.unshift(e); else REG[i]=e; }
const locked = () => S && S.meta.status!=='draft';

let saveTimer;
function setSave(t){ const el=document.getElementById('saveState'); if(el) el.textContent=t; }
function save(now){
  const j=S; if(!j) return; setSave('Saving'); clearTimeout(saveTimer);
  const run=async()=>{ try{ j.updated=Date.now(); await dbSet('job:'+j.id,j); upsertReg(j); await dbSet('register',REG); setSave('Saved on this iPad'); }catch(e){ console.error(e); setSave('Not saved: storage full'); toast('This iPad is out of storage. Issue or delete old reports.',6000); } };
  if(now) return run(); saveTimer=setTimeout(run,400);
}
async function openJob(id){
  if(S) await save(true);
  const j=await dbGet('job:'+id); if(!j) return toast('That report could not be found on this iPad.');
  normalise(j); await loadImages(j); S=j; await dbSet('currentId',id); view='job'; render();
}
async function createJob(){
  if(S) await save(true);
  const j=blankJob(); j.job.reportNo=takeNumber(); j.locations=[newLoc(j)];
  S=j; await save(true); await dbSet('currentId',j.id); view='job'; render(); toast(`New report ${j.job.reportNo} started`);
}
async function addJob(raw,{keepNumber=true}={}){
  if(S) await save(true);
  let j=await externalise(raw); normalise(j); j.id=uid();
  if(!keepNumber) j.job.reportNo=takeNumber();
  await loadImages(j); S=j; await save(true); await dbSet('currentId',j.id); view='job'; render();
}
async function deleteJob(id){
  const r=REG.find(x=>x.id===id); if(!r) return;
  if(r.status!=='draft') return toast('Issued reports stay in the register.');
  if(!confirm(`Delete draft ${r.reportNo||'report'} Rev ${r.rev} from this iPad? This cannot be undone.`)) return;
  await dbDel('job:'+id); REG=REG.filter(x=>x.id!==id); await dbSet('register',REG);
  if(r.rev==='0' && r.reportNo===fmtNo(parseInt(settings.device.next)-1)){ settings.device.next=parseInt(settings.device.next)-1; saveSettings(); }
  if(S && S.id===id){ S=null; if(REG.length) await openJob(REG[0].id); else await createJob(); }
  else renderView();
  gc(); toast('Draft deleted');
}
async function newRevision(){
  const next=String((parseInt(S.job.rev)||0)+1);
  if(REG.some(r=>r.reportNo===S.job.reportNo && r.rev===next)) return toast(`Rev ${next} already exists in the register. Open it from there.`,5000);
  if(!confirm(`Create Rev ${next} of ${S.job.reportNo}? Rev ${S.job.rev} stays in the register unchanged.`)) return;
  await save(true);
  const j=structuredClone(S); j.id=uid(); j.job.rev=next; j.job.date=today(); j.job.revNotes='';
  j.meta={status:'draft',issuedAt:'',device:settings.device.name,created:new Date().toISOString(),supersedes:S.id};
  S=j; await save(true); await dbSet('currentId',j.id); view='job'; render(); toast(`Rev ${next} created. Add revision notes on Job details.`,4000);
}

/* ================= Helpers ================= */
const esc = s => String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function root(path){ return path.startsWith('settings.')?{settings}:S; }
function get(path){ return path.split('.').reduce((o,k)=>o?.[k], root(path)); }
function set(path,val){
  const isSet=path.startsWith('settings.'); if(!isSet && locked()) return;
  const ks=path.split('.'); const last=ks.pop(); ks.reduce((o,k)=>o[k],root(path))[last]=val;

/* ================= Checks ================= */
function checkJob(){
  const out=[], J=S.job, I=S.instrument, flagged=new Set();
  const B=t=>out.push({sev:'block',text:t}), W=(t,ack)=>out.push({sev:'warn',text:t,ack});
  if(!T(J.reportNo)) B('Report number is missing');
  else if(REG.some(r=>r.id!==S.id&&r.reportNo===T(J.reportNo)&&r.rev===T(J.rev))) B(`${J.reportNo} Rev ${J.rev} already exists in the register`);
  if(!T(J.project)) B('Project is missing'); if(!T(J.client)) B('Client is missing');
  if(!T(J.scope)) W('Introduction and scope is empty');
  if(T(J.rev)!=='0' && !T(J.revNotes)) W('Revision notes are empty for a revised report');
  if(!T(I.serial)) B('Instrument serial number is missing');
  if(!T(I.certNo)||!I.calDue) B('Calibration certificate number or validity date is missing');
  else if(I.calDue < (J.scanDate||today())) B('Calibration had expired on the scan date');
  if(!T(I.certSerial)) W('Serial number on the certificate is not entered, so it cannot be cross-checked');
  else if(T(I.serial) && normSerial(I.serial)!==normSerial(I.certSerial)) B(`Serial number mismatch: instrument ${I.serial}, certificate ${I.certSerial}`);
  const G=new Map(); const add=(sev,key,L)=>{ const g=G.get(key)||{sev,ids:[]}; g.ids.push(T(L.id)||'?'); G.set(key,g); flagged.add(L.uid); };
  const ids=new Map(); S.locations.forEach(L=>{ const k=T(L.id); ids.set(k,(ids.get(k)||0)+1); });
  S.locations.forEach(L=>{
    if(!T(L.id)) add('block','location ID is missing',L); else if(ids.get(T(L.id))>1) add('block','location ID used more than once',L);
    if(!L.status) add('block',"engineer's decision not set",L);
    if(!T(L.result)) add('block','result text is empty',L);
    if(/\[ENGINEER TO CONFIRM/.test(L.result+' '+L.conclusion)) add('block','"engineer to confirm" marker still in the text',L);
    if(L.dupOf) add('block','copied from another location and not yet edited or confirmed',L);
    if(!T(L.er)) add('block','dielectric constant not recorded',L);
    else { const e=parseFloat(L.er); if(!(e>=3.5&&e<=15)) add('warn','εr outside the usual range for concrete (3.5 to 15)',L); else if(!L.erChecked) add('warn','εr not confirmed against the GP8000 screen',L); }
    if(!L.scan) add('warn','no GPR scan image',L);
    if(!L.photo) add('warn','no marked-up site photo',L);
    if(!T(L.spacing)) add('warn','top bar spacing not recorded',L);
    if(L.status==='clear' && T(L.targets) && !isNone(L.targets) && !/offset|clear of|away from|outside|from (the )?core|\b(north|south|east|west)\b|\bmm (from|of)\b/i.test(L.conclusion))
      add('warn','clear to proceed with other targets recorded; state the distance of the target from the core in the conclusion',L);
  });
  for(const [key,g] of G) (g.sev==='block'?B:W)(`${listIds(g.ids)}: ${key}`);
  const sig=new Map(); S.locations.forEach(L=>{ if(L.sameOk||!T(L.result)) return; const k=JSON.stringify(['spacing','cover','bottom','targets','thickness','anomalies','er','result'].map(f=>T(L[f]).toLowerCase())); (sig.get(k)||sig.set(k,[]).get(k)).push(L); });
  const same=[...sig.values()].filter(g=>g.length>1); same.flat().forEach(L=>flagged.add(L.uid));
  if(same.length>3) W(`${same.flat().length} locations share identical findings and result text with at least one other location (${listIds(same.flat().map(L=>T(L.id)))}). Use the Flagged filter in the table to check them.`, same.flat().map(L=>L.uid).join(','));
  else same.forEach(grp=>W(`${listIds(grp.map(L=>T(L.id)))} have identical findings and result text. Confirm each was measured at its own location.`, grp.map(L=>L.uid).join(',')));
  if(!T(S.summary)) B('Executive summary is empty');
  else if(/\[ENGINEER TO CONFIRM/.test(S.summary)) B('Executive summary still contains an "engineer to confirm" marker');
  out.flagged=flagged; return out;
}

/* ================= Offline drafting ================= */
const lc = x => { x=T(x); return /^[A-Z]{2}/.test(x)||/^[A-Z]-?\d/.test(x) ? x : x.charAt(0).toLowerCase()+x.slice(1); };
const dot = x => { x=T(x); return x && !/[.!?]$/.test(x) ? x+'.' : x; };
const ask = what => `[ENGINEER TO CONFIRM: ${what}]`;
function draftLocation(L){
  const out=[]; const where=T(L.description)?` at ${lc(L.description).replace(/\.$/,'')}`:'';
  out.push(`GPR scanning was carried out${where}${T(L.scanType)?`, using a ${lc(L.scanType).replace(/\.$/,'')}`:''}.`);
  if(T(L.spacing)||T(L.cover)||T(L.orientation)){
    let t=`Top reinforcement${T(L.orientation)?` (${lc(L.orientation)})`:''} was detected`;
    t+= T(L.spacing)?` at approximately ${T(L.spacing)} centres`:` (spacing ${ask('bar spacing')})`;
    t+= T(L.cover)?`, with concrete cover of ${T(L.cover)}.`:`, with concrete cover of ${ask('cover depth')}.`;
    out.push(t);
  } else out.push(`Top reinforcement: ${ask('orientation, spacing and cover')}.`);
  if(T(L.bottom)) out.push(isNone(L.bottom)?'Bottom reinforcement was not resolved.':`Bottom reinforcement was detected at ${lc(L.bottom).replace(/\.$/,'')}.`);
  if(T(L.targets)) out.push(isNone(L.targets)?'No other embedded targets were detected.':`An additional target was identified: ${lc(dot(L.targets))}`);
  if(T(L.thickness)) out.push(`The slab underside was observed at ${lc(L.thickness).replace(/\.$/,'')}.`);
  const v=gprVelocity(L.er);
  out.push(v?`Depths are based on a dielectric constant of ${T(L.er)} (wave velocity ${v.toFixed(3)} m/ns)${T(L.erMethod)?`, determined by ${lc(L.erMethod)}`:''}.`
            :`Depths are based on a dielectric constant of ${ask('εr and calibration method')}.`);
  if(T(L.anomalies)) out.push(isNone(L.anomalies)?'No anomalies were observed.':`Anomalies noted: ${lc(dot(L.anomalies))}`);
  if(!T(L.conclusion)) out.push({clear:'The location is considered clear to proceed at the marked position.',restricted:`Works may proceed subject to the following restrictions: ${ask('restrictions')}.`,notfeasible:'Works are not considered feasible at the marked position.'}[L.status]||`Conclusion: ${ask("engineer's decision")}.`);
  return out.join(' ');
}
function draftSummary(){
  const Ls=S.locations, n=Ls.length, id=(L,i)=>T(L.id)||'Location '+(i+1);
  const out=[`GPR scanning was carried out at ${n} location${n>1?'s':''}${T(S.job.project)?` for ${lc(S.job.project)}`:''}${T(S.job.location)?` at ${T(S.job.location)}`:''} to locate reinforcement and embedded services.`];
  const groups={clear:[],restricted:[],notfeasible:[],'':[]}; Ls.forEach((L,i)=>groups[L.status||''].push(id(L,i)));
  const names=a=>a.length>10?`${a.length} locations (listed in the summary table)`:a.join(', ');
  const say=(arr,txt)=>arr.length&&out.push(`${names(arr)} ${arr.length>1?'were':'was'} assessed as ${txt}.`);
  say(groups.clear,'clear to proceed at the marked position'+(groups.clear.length>1?'s':''));
  say(groups.restricted,'able to proceed subject to restrictions');
  say(groups.notfeasible,'not feasible at the marked position'+(groups.notfeasible.length>1?'s':''));
  if(groups[''].length) out.push(`The decision for ${names(groups[''])} is ${ask('status')}.`);
  const tg=Ls.map((L,i)=>T(L.targets)&&!isNone(L.targets)?`${lc(T(L.targets).replace(/\.$/,''))} (${id(L,i)})`:'').filter(Boolean);
  if(tg.length>6) out.push(`Embedded services other than reinforcement were identified at ${tg.length} locations; details are given on each location page.`);
  else if(tg.length) out.push(`Embedded services identified include ${tg.join('; ')}.`);
  out.push('Detailed findings are given on each location page. Readers should refer to the limitations section of this report.');
  return out.join(' ');
}
function draft(target){
  if(target==='summary'){ S.summary=draftSummary(); save(); document.getElementById('summary').value=S.summary; }
  else { const L=locByUid(target); L.result=draftLocation(L); save(); const ta=document.querySelector(`[data-p="locations.${S.locations.indexOf(L)}.result"]`); if(ta) ta.value=L.result; }
  toast('Draft ready. Review and edit before issuing.');
}
const RULES = `You are editing text for a GPR (ground penetrating radar) concrete scanning report by MHS+ Project Management Services, Dubai.
Rules: use ONLY the facts given below. Never add or change measurements, depths, targets or conclusions. Keep every [ENGINEER TO CONFIRM: ...] marker exactly as written. Formal, concise British engineering English, past tense, mm for dimensions. Return ONLY the finished paragraph: no heading, no bullets, no preamble, no quotation marks.`;
function locFactsLite(L){ const v=gprVelocity(L.er); const o={location:L.id,description:L.description,scan:L.scanType,dielectric:L.er,velocity:v?v.toFixed(3)+' m/ns':'',velocity_method:L.erMethod,top_reinforcement:L.orientation,spacing:L.spacing,cover:L.cover,bottom_reinforcement:L.bottom,other_targets:L.targets,slab_thickness:L.thickness,anomalies:L.anomalies,decision:STATUS_LABEL[L.status]||'not set',engineer_conclusion:L.conclusion};
  Object.keys(o).forEach(k=>{ if(!T(o[k])) delete o[k]; }); return o; }
function aiPrompt(t){
  if(t==='summary'){
    const Ls=S.locations; let facts;
    if(Ls.length<=15) facts=JSON.stringify(Ls.map(locFactsLite));
    else { const c=k=>Ls.filter(L=>L.status===k).length; facts=JSON.stringify({total_locations:Ls.length,clear:c('clear'),with_restrictions:c('restricted'),not_feasible:c('notfeasible'),
      locations_with_other_targets:Ls.filter(L=>T(L.targets)&&!isNone(L.targets)).slice(0,20).map(L=>`${L.id}: ${T(L.targets)}`)}); }
    return `${RULES}\n\nTask: improve this executive summary (80 to 160 words).\n\nPROJECT: ${T(S.job.project)}\nSITE: ${T(S.job.location)}\nFINDINGS: ${facts}\n\nSTARTING DRAFT:\n${T(S.summary)||draftSummary()}`;
  }
  const L=locByUid(t);
  return `${RULES}\n\nTask: improve this location result paragraph (60 to 130 words).\n\nFACTS: ${JSON.stringify(locFactsLite(L))}\n\nSTARTING DRAFT:\n${T(L.result)||draftLocation(L)}`;
}
async function sendToShortcut(t){
  const prompt=aiPrompt(t); lastPrompt=prompt;
  try{ await navigator.clipboard.writeText(prompt); }catch{ return toast('Could not copy to the clipboard. Tap Improve with AI again.',4000); }
  toast('Opening Shortcuts. When it finishes, come back and tap Paste AI draft.',4000);
  setTimeout(()=>{ location.href='shortcuts://run-shortcut?name='+encodeURIComponent(settings.shortcut)+'&input=clipboard'; },350);
}
async function pasteDraft(t){
  let txt=''; try{ txt=(await navigator.clipboard.readText()).trim(); }catch{ return toast('Allow Paste when the iPad asks, then try again.',4000); }
  if(!txt) return toast('The clipboard is empty. Run Improve with AI first.',4000);
  if(txt===lastPrompt.trim()||txt.startsWith('You are editing text for a GPR')) return toast('The shortcut has not replaced the clipboard yet. Check it ran, then paste again.',5000);
  txt=txt.replace(/^["“]|["”]$/g,'').trim();
  const lost=(t==='summary'?S.summary:locByUid(t).result).match(/\[ENGINEER TO CONFIRM:[^\]]*\]/g)||[];
  if(t==='summary'){ S.summary=txt; document.getElementById('summary').value=txt; }
  else { const L=locByUid(t); L.result=txt; const ta=document.querySelector(`[data-p="locations.${S.locations.indexOf(L)}.result"]`); if(ta) ta.value=txt; }
  save(); const dropped=lost.filter(m=>!txt.includes(m)).length;
  toast(dropped?`AI draft pasted. Warning: ${dropped} "engineer to confirm" marker(s) were removed. Check the facts.`:'AI draft pasted. Review before issuing.',dropped?6000:3000);
}
const hasText = t => t==='summary' ? !!T(S.summary) : !!T(locByUid(t)?.result);

/* ================= PDF, files and sharing ================= */
async function pdfFile(){
  const busy=toast('<span class="spin"></span> Building the PDF…',0); await new Promise(r=>setTimeout(r,60));
  try{
    let st=inlineImages(S);
    if(S.layout==='compact'){
      const cache=new Map(); const sh=async s=>{ if(!s||!s.startsWith('data:image')) return s; if(!cache.has(s)) cache.set(s,await shrink(s,1100,0.72)); return cache.get(s); };
      for(const L of st.locations){ L.photo=await sh(L.photo); L.scan=await sh(L.scan); }
      for(const p of st.job.photos) p.src=await sh(p.src);
    }
    const doc=buildReport({...st,company:settings.company}, window.jspdf.jsPDF, {layout:S.layout, draft:S.meta.status==='draft'});
    const name=`${fileBase()}${S.meta.status==='draft'?'_DRAFT':''}.pdf`;
    return new File([doc.output('blob')],name,{type:'application/pdf'});
  } finally { busy.remove(); }
}
function csvCell(x){ x=String(x??''); return /[",\n]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x; }
function registerFile(){
  const cols=['Report no.','Rev','Status','Issued','Client','Project','Site','Scan date','Locations','iPad'];
  const rows=[...REG].sort((a,b)=>(a.reportNo+a.rev).localeCompare(b.reportNo+b.rev,undefined,{numeric:true}))
    .map(r=>[r.reportNo,r.rev,REG_LABEL[r.status],(r.issuedAt||'').slice(0,10),r.client,r.project,r.location,r.scanDate,r.n,r.device].map(csvCell).join(','));
  return new File(['\ufeff'+[cols.join(','),...rows].join('\r\n')],`MHS_GPR_Register_${T(settings.device.name).replace(/\W+/g,'_')||'iPad'}.csv`,{type:'text/csv'});
}
const jobFile = () => new File([JSON.stringify(inlineImages(S))],`${fileBase()}_job.json`,{type:'application/json'});
function download(f){ const u=URL.createObjectURL(f); const a=document.createElement('a'); a.href=u; a.download=f.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000); }
async function shareFiles(files,title){
  if(navigator.canShare && navigator.canShare({files})){
    try{ await navigator.share({files,title}); return; }
    catch(e){ if(e.name==='AbortError') return; if(e.name==='NotAllowedError') return readyBar(files,title); console.warn(e); }
  }
  files.forEach(download); toast(`${files.length>1?files.length+' files':files[0].name} saved to Downloads`);
}
function readyBar(files,title){
  document.querySelectorAll('.readybar').forEach(x=>x.remove());
  const b=document.createElement('div'); b.className='readybar'; b.setAttribute('role','status');
  b.innerHTML=`<span>${esc(title)} is ready</span><button class="btn primary" id="rbShare">Save or share</button><button class="btn ghost" id="rbClose">Close</button>`;
  document.body.appendChild(b);
  b.querySelector('#rbShare').onclick=async()=>{ try{ await navigator.share({files,title}); }catch(e){ if(e.name!=='AbortError') files.forEach(download); } b.remove(); };
  b.querySelector('#rbClose').onclick=()=>b.remove();
}
async function makePdf(){
  const items=checkJob().filter(x=>x.sev==='block');
  if(S.meta.status==='draft' && items.length && !confirm(`${items.length} blocking item(s) are still open (see Summary, checks and issue).\n\nCreate a DRAFT PDF anyway?`)) return;
  try{ const f=await pdfFile(); await shareFiles([f], f.name); }catch(e){ console.error(e); toast('PDF could not be created: '+esc(e.message),5000); }
}
async function issueReport(){
  const items=checkJob(); if(items.some(x=>x.sev==='block')) return toast('Fix the blocking items first.');
  const w=items.filter(x=>x.sev==='warn').length;
  if(!confirm(`${w?`${w} item(s) to review are still listed.\n\n`:''}Issue ${S.job.reportNo} Rev ${S.job.rev}? It will be locked. Later changes need a new revision.`)) return;
  S.meta.status='issued'; S.meta.issuedAt=new Date().toISOString(); if(!S.job.date) S.job.date=today();
  await save(true);
  if(S.meta.supersedes){ const old=await dbGet('job:'+S.meta.supersedes); if(old){ old.meta.status='superseded'; await dbSet('job:'+old.id,old); upsertReg(normalise(old)); await dbSet('register',REG); } }
  render(); await shareIssued();
}
async function shareIssued(){
  try{ const files=[await pdfFile(), jobFile(), registerFile()]; await shareFiles(files, `${S.job.reportNo} Rev ${S.job.rev}`); }
  catch(e){ console.error(e); toast('Files could not be created: '+esc(e.message),5000); }
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('button'); if(!b||b.disabled) return;
  if(b.dataset.go){ view=b.dataset.go; render(); return; }
  if(b.dataset.open){ openJob(b.dataset.open); return; }
  if(b.dataset.deljob){ deleteJob(b.dataset.deljob); return; }
  if(b.dataset.filter){ TABLEF=b.dataset.filter; renderView(); return; }
  if(b.dataset.layout){ if(locked()) return; S.layout=b.dataset.layout; save(); renderView(); return; }
  if(b.dataset.ack){ b.dataset.ack.split(',').forEach(u=>{ const L=locByUid(u); if(L) L.sameOk=true; }); save(); renderView(); return; }
  if(b.dataset.samedup){ const L=locByUid(b.dataset.samedup); L.dupOf=''; L.sameOk=true; save(); renderView(); return; }
  if(b.id==='btnPdf'||b.id==='btnPdf2'){ makePdf(); return; }
  if(b.id==='btnIssue'){ issueReport(); return; }
  if(b.id==='btnReshare'){ shareIssued(); return; }
  if(b.id==='btnNewRev'){ newRevision(); return; }
  if(b.id==='newJob'){ createJob(); return; }
  if(b.id==='exportReg'){ shareFiles([registerFile()],'Register'); return; }
  if(b.id==='sampleJob'){ try{ const d=await (await fetch('sample.json')).json(); await addJob(d); toast('Sample job added to the register'); }catch(err){ console.error(err); toast('Sample could not be loaded.'); } return; }
  if(locked()) return;
  if(b.id==='addLoc'||b.id==='addLoc2'||b.id==='addNext'){ const L=newLoc(); S.locations.push(L); save(); view='loc:'+L.uid; render(); return; }
  if(b.dataset.clear){ set(b.dataset.clear,''); renderView(); return; }
  if(b.dataset.delphoto){ S.job.photos.splice(+b.dataset.delphoto,1); save(); renderView(); return; }
  if(b.dataset.status){ const L=locByUid(view.slice(4)); L.status=L.status===b.dataset.status?'':b.dataset.status; save(); renderView(); return; }
  if(b.dataset.ai){ sendToShortcut(b.dataset.ai); return; }
  if(b.dataset.paste){ pasteDraft(b.dataset.paste); return; }
  if(b.dataset.draft){ if(hasText(b.dataset.draft) && !confirm('Replace the existing text with a fresh draft?')) return; draft(b.dataset.draft); return; }
  if(b.id==='draftAll'){ let n=0,k=0; S.locations.forEach(L=>{ if(T(L.result)) k++; else { L.result=draftLocation(L); n++; } }); save(); renderView(); toast(`Drafted ${n} result${n===1?'':'s'}.${k?` ${k} already had text and were left unchanged.`:''}`,4000); return; }
  if(b.id==='applyDefaults'){ const d=S.defaults; let n=0; S.locations.forEach(L=>['description','scanType','er','erMethod','orientation','spacing','thickness'].forEach(k=>{ if(!T(L[k])&&T(d[k])){ L[k]=d[k]; n++; if(k==='er') L.erChecked=false; } })); save(); renderView(); toast(`${n} empty field${n===1?'':'s'} filled.`); return; }
  if(b.dataset.dup){ const L=locByUid(b.dataset.dup); const c={...L,uid:uid(),id:nextLocId(),photo:'',scan:'',result:'',status:'',erChecked:false,sameOk:false,dupOf:T(L.id)||'previous location'}; S.locations.splice(S.locations.indexOf(L)+1,0,c); save(); view='loc:'+c.uid; render(); return; }
  if(b.dataset.del){ if(S.locations.length===1) return toast('A report needs at least one location.'); if(!confirm('Delete this location and its images?')) return; const i=S.locations.findIndex(l=>l.uid===b.dataset.del); S.locations.splice(i,1); save(); const nb=S.locations[Math.min(i,S.locations.length-1)]; view='loc:'+nb.uid; render(); return; }
  if(b.id==='instrDefault'){ settings.instrument={...S.instrument, certImage:src(S.instrument.certImage)}; saveSettings(); toast('Saved as company default'); return; }
  if(b.id==='bulkClear'){ BULK={scans:[],photos:[],sort:false,prefix:S.defaults.idPrefix??'',start:null}; renderView(); return; }
  if(b.id==='bulkGo'){
    const P=bulkPairs(); const clash=pristine()?[]:P.filter(p=>S.locations.some(L=>T(L.id)===p.id)); if(clash.length) return toast('Some IDs already exist. Change the first number.');
    b.disabled=true; const prog=document.getElementById('bulkProg');
    if(pristine()) S.locations=[];
    let made=0;
    for(const p of P){
      prog.textContent=`Processing ${made+1} of ${P.length}…`;
      const L=newLoc(); L.id=p.id;
      try{ L.scan=await putImage(await resizeImage(p.scan,1600,0.85)); if(p.photo) L.photo=await putImage(await resizeImage(p.photo,1400,0.8)); }catch{ toast(`Could not read ${esc(p.scan.name)}; skipped.`); continue; }
      S.locations.push(L); made++; if(made%10===0) save();
    }
    if(!S.locations.length) S.locations.push(newLoc());
    await save(true); BULK={scans:[],photos:[],sort:false,prefix:'',start:null}; view='table'; render();
    toast(`${made} locations added. Fill in the findings in the table.`,4000); return;
  }
});

/* ================= Boot ================= */
(async()=>{
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch{}
  REG=(await dbGet('register'))||[];
  let cid=await dbGet('currentId');
  if(!REG.length){
    const old=await dbGet('current');
    if(old&&old.job){ const j=normalise(await externalise(old)); j.meta.device=settings.device.name; S=j; await save(true); cid=j.id; await dbDel('current'); }
  }
  if(cid && REG.some(r=>r.id===cid)) await openJob(cid);
  else if(REG.length) await openJob(REG[0].id);
  else await createJob();
  setSave('Saved on this iPad');
  setTimeout(gc,4000);
  if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js');
})();
</script>
